# ======================= GENEL / MESAJLAR =======================
server-name: "ChicagoRP"           # {server} yerine yazilir (prefix, baslik, mesajlar)
prefix: "&8[&6&l{server}&8] &7» &f"
join-message: "&8[&a+&8] &f{player} &7şehre geldi &8(&e{online}&8)"
quit-message: "&8[&c-&8] &f{player} &7şehirden ayrıldı"
welcome-title: "&6&l{server}"
welcome-subtitle: "&7Hoş geldin, &f{player}"
# ======================= MODELLER / KAYNAK PAKETI =======================
models:
  enabled: true                    # false: paket yoksa basit blok gorunumleri
  vehicle-yaw-offset: 0            # araba ters gorunuyorsa 180 (veya /sehir araccevir)
  sign-yaw-offset: 0               # tabela yazisi ters gorunuyorsa 180 (veya /sehir tabelacevir)
resource-pack:
  url: ""                          # ChicagoRP-ResourcePack.zip'in indirme linki
  sha1: "5b625c7f6cc876488bf33b493a9d35a222b64970"
  required: true
vehicle:
  max-passengers: 4
